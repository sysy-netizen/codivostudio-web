<!-- Codivo Studio Rank Tracker 실행 페이지 — 프로그램 실행 영역(iframe). -->
<div class="cv-rank-app">
<style>
.cv-rank-app,
.cv-rank-app *,
.cv-rank-app *::before,
.cv-rank-app *::after {
  box-sizing: border-box;
}

  background: #FFFFFF;
  padding: 0 0 2.5rem;
}

.cv-rank-app__inner {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 1.5rem;
}

.cv-rank-app__frame-wrap {
  width: 100%;
  overflow: hidden;
  border: 1px solid #E5E7EB;
  border-radius: 16px;
  background: #FAFAFA;
}

  display: block;
  width: 100%;
  height: 900px;
  min-height: 900px;
  border: none;
}

@media (min-width: 1200px) {
  .cv-rank-app__frame-wrap iframe {
    height: max(900px, 80vh);
  }
}

@media (max-width: 860px) {

    height: 850px;
    min-height: 850px;
  }

@media (max-width: 480px) {
  .cv-rank-app__inner {
    padding: 0 1rem;
  }

  .cv-rank-app__frame-wrap {

  }

    height: 800px;
    min-height: 800px;
  }

      referrerpolicy="strict-origin-when-cross-origin">

  </div>
</div>
</div>
